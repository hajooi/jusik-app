name: Daily Market Data Sync

on:
  schedule:
    # 일~목 23:35 UTC = 한국 시간(KST) 월~금 08:35 (한국 장 개장 25분 전)
    # ▸ 미국장 마감(05:00/06:00 KST) 이후 2.5~3.5시간 경과 → Yahoo 및 FRED 공식 확정 완료
    # ▸ 한국장 개장(09:00 KST) 직전 글로벌 시황 및 5대 지표 신호등 확인
    # ▸ 정각(:00)을 피해 35분 지정으로 GitHub 큐 지연(Queue delay) 0분 칼실행 보장
    - cron: '35 23 * * 0-4'
  workflow_dispatch: # 깃허브 Actions 탭에서 버튼 클릭으로 즉시 수동 실행 가능

jobs:
  sync-market:
    name: Sync Market Daily Snapshot & Charts
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Market Daily Update API
        run: |
          echo "Starting Market Daily Sync at $(date -u)..."
          RESPONSE=$(curl -s -L -w "\nHTTP_STATUS:%{http_code}" -X GET "https://www.jusik.app/api/market/daily?refresh=true" -H "User-Agent: GitHub-Actions-Market-Cron")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          echo "Status: $HTTP_STATUS"
          echo "Response summary:"
          echo "$HTTP_BODY" | head -n 30
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to sync market data. HTTP Status: $HTTP_STATUS"
            exit 1
          fi
          echo "Market Daily Sync completed successfully!"

      - name: Notify Telegram on Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN || '7836688476:AAGJOs8nHrvRD-T1XPSIfY1wDSXKADQQS2Q' }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"${{ secrets.TELEGRAM_CHAT_ID || '7954599592' }}","text":"🚨 <b>[jusik.app 자동화 오류 경고]</b>\n일일 마켓 데이터 동기화 작업(market-daily-sync) 중 오류가 발생했습니다. GitHub Actions 로그 및 API 상태를 확인해 주세요.","parse_mode":"HTML"}'

