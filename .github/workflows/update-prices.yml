name: Update Historical Prices & Backtest Data

on:
  schedule:
    # 매달 1일 오전 0시 (UTC) -> 한국 시간 오전 9시 실행
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Update market data
        run: |
          python scripts/update_market_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/historicalPrices.json src/data/backtestData.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update market historical prices and backtest data" && git push)
